name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Actions are pinned to full commit SHAs (audit 2026-08-16 F-09): a retagged or compromised
    # major tag would otherwise run arbitrary code in a job that can read the deploy secrets.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm audit --prod

  # Build the runtime image in CI (audit 2026-08-17 M18) so Dockerfile/entrypoint surgery (USER
  # switch, package removal, new COPYs) fails here on a PR instead of only at the Coolify deploy,
  # where a broken image burns the deploy window. No push — this only proves the image builds.
  docker-build:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build image (no push)
        run: docker build -t walkchamp-backend:ci .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # gitleaks scans the pushed commit range, so it needs the parent commit present. The
      # default shallow checkout leaves it out and the scan dies on "unknown revision".
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3

  # Pushes to main deploy themselves once verify + secret-scan are green. Coolify always builds
  # the current head of main, so a deploy triggered here can pick up a newer commit than the one
  # that triggered it; the concurrency group keeps those from overlapping rather than racing.
  deploy:
    name: Deploy to production
    needs: [verify, secret-scan, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
    steps:
      - name: Queue Coolify deployment
        id: queue
        run: |
          set -euo pipefail
          body=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false")
          uuid=$(jq -r '.deployments[0].deployment_uuid // empty' <<<"$body")
          if [ -z "$uuid" ]; then
            echo "Coolify refused to queue a deployment:"
            jq -r '.deployments[0].message // .message // "unknown error"' <<<"$body"
            exit 1
          fi
          echo "uuid=${uuid}" >>"$GITHUB_OUTPUT"
          echo "Queued deployment ${uuid} for ${GITHUB_SHA}"

      - name: Wait for deployment to finish
        run: |
          set -euo pipefail
          uuid='${{ steps.queue.outputs.uuid }}'
          deadline=$((SECONDS + 1800))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(curl -fsS -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${COOLIFY_URL}/api/v1/deployments/${uuid}" | jq -r '.status // "unknown"')
            case "$status" in
              finished)
                echo "Deployment ${uuid} finished."
                exit 0
                ;;
              failed|cancelled-by-user)
                echo "Deployment ${uuid} ended as '${status}'. See the Coolify deployment log."
                exit 1
                ;;
              *)
                echo "status=${status}"
                ;;
            esac
            sleep 15
          done
          echo "Timed out after 30m waiting on deployment ${uuid}."
          exit 1

      - name: Smoke-check the public API
        run: |
          set -euo pipefail
          for url in \
            https://api.walkchamp.miragaming.com/api/healthz \
            https://api.walkchamp.miragaming.com/api/readyz; do
            echo "GET ${url}"
            curl -fsS --retry 5 --retry-delay 5 --retry-all-errors --max-time 15 "$url"
            echo
          done
