x-app-env: &app-env
  NODE_ENV: production
  PORT: "8080"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
  TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-}
  ENABLE_EDGE_STRICT_MODE: ${ENABLE_EDGE_STRICT_MODE:-false}
  ENABLE_RATE_LIMITING: ${ENABLE_RATE_LIMITING:-true}
  ENABLE_NEW_RATE_LIMITER: ${ENABLE_NEW_RATE_LIMITER:-true}
  ENABLE_CACHE_GET_OR_COMPUTE: ${ENABLE_CACHE_GET_OR_COMPUTE:-false}
  ENABLE_LOAD_SHEDDING: ${ENABLE_LOAD_SHEDDING:-false}
  ENABLE_BULLMQ_WEBHOOK_PROCESSING: ${ENABLE_BULLMQ_WEBHOOK_PROCESSING:-false}
  ENABLE_CIRCUIT_BREAKERS: ${ENABLE_CIRCUIT_BREAKERS:-false}
  BLOOM_GUARDS_MODE: ${BLOOM_GUARDS_MODE:-monitor}
  ENABLE_REDIS_LIVE_RACE: ${ENABLE_REDIS_LIVE_RACE:-false}
  ENABLE_REDIS_PRESENCE_MIRROR_WRITE: ${ENABLE_REDIS_PRESENCE_MIRROR_WRITE:-false}
  ENABLE_REDIS_PRESENCE_SERVE: ${ENABLE_REDIS_PRESENCE_SERVE:-false}
  ENABLE_REDIS_WALK_SHADOW_WRITE: ${ENABLE_REDIS_WALK_SHADOW_WRITE:-false}
  ENABLE_REDIS_WALK_SERVE: ${ENABLE_REDIS_WALK_SERVE:-false}
  REDIS_WALK_CANARY_PERCENT: ${REDIS_WALK_CANARY_PERCENT:-0}
  ENABLE_REDIS_LEADERBOARD_MIRROR_WRITE: ${ENABLE_REDIS_LEADERBOARD_MIRROR_WRITE:-false}
  ENABLE_REDIS_LEADERBOARD_SERVE: ${ENABLE_REDIS_LEADERBOARD_SERVE:-false}
  # All three Redis instances require auth (audit 2026-08-16 F-06): network isolation alone is
  # one compose edit away from being gone, and an unauthenticated redis-queue is the BullMQ
  # settlement pipeline. Use a URL-safe password (alphanumeric) — it is spliced into these URLs.
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis-cache:6379
  REDIS_CACHE_URL: redis://:${REDIS_PASSWORD}@redis-cache:6379
  REDIS_QUEUE_URL: redis://:${REDIS_PASSWORD}@redis-queue:6379
  REDIS_LIVE_URL: redis://:${REDIS_PASSWORD}@redis-live:6379
  DATABASE_RUNTIME_URL: ${DATABASE_RUNTIME_URL:?DATABASE_RUNTIME_URL is required}
  DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?DATABASE_ADMIN_URL is required}
  DESCOPE_PROJECT_ID: ${DESCOPE_PROJECT_ID:?DESCOPE_PROJECT_ID is required}
  DESCOPE_MANAGEMENT_KEY: ${DESCOPE_MANAGEMENT_KEY:?DESCOPE_MANAGEMENT_KEY is required}
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
  PUSHER_APP_ID: ${PUSHER_APP_ID:?PUSHER_APP_ID is required}
  PUSHER_KEY: ${PUSHER_KEY:?PUSHER_KEY is required}
  PUSHER_SECRET: ${PUSHER_SECRET:?PUSHER_SECRET is required}
  PUSHER_CLUSTER: ${PUSHER_CLUSTER:?PUSHER_CLUSTER is required}
  ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:?ONESIGNAL_APP_ID is required}
  ONESIGNAL_REST_API_KEY: ${ONESIGNAL_REST_API_KEY:?ONESIGNAL_REST_API_KEY is required}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?RAZORPAY_KEY_ID is required}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?RAZORPAY_KEY_SECRET is required}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?RAZORPAY_WEBHOOK_SECRET is required}
  CASH_FEATURES_ENABLED: ${CASH_FEATURES_ENABLED:-false}
  FEATURE_CASH_FEATURES: ${FEATURE_CASH_FEATURES:-false}
  PAYMENTS_LIVE_MODE: ${PAYMENTS_LIVE_MODE:-true}
  REAL_MONEY_PRODUCTION_APPROVED: ${REAL_MONEY_PRODUCTION_APPROVED:-false}
  REAL_MONEY_LEGAL_APPROVED: ${REAL_MONEY_LEGAL_APPROVED:-false}
  REAL_MONEY_KYC_TAX_READY: ${REAL_MONEY_KYC_TAX_READY:-false}
  REAL_MONEY_PROVIDER_SANDBOX_TESTED: ${REAL_MONEY_PROVIDER_SANDBOX_TESTED:-false}
  REAL_MONEY_WITHDRAWAL_CONTROLS_READY: ${REAL_MONEY_WITHDRAWAL_CONTROLS_READY:-false}
  LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL is required}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
  OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?OBJECT_STORAGE_ENDPOINT is required}
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-auto}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
  OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?OBJECT_STORAGE_ACCESS_KEY_ID is required}
  OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?OBJECT_STORAGE_SECRET_ACCESS_KEY is required}
  OBJECT_STORAGE_PUBLIC_BASE_URL: ${OBJECT_STORAGE_PUBLIC_BASE_URL:?OBJECT_STORAGE_PUBLIC_BASE_URL is required}
  APPLE_EXPECTED_AUDIENCES: ${APPLE_EXPECTED_AUDIENCES:-com.walkchamp.app}
  # ── In-app purchases (Mic Pass + coin packs) ────────────────────────────────
  # POST /api/purchases/verify verifies receipts against the stores at call time. Compose only
  # forwards the keys named here, so a credential set in the Coolify UI but missing from this
  # list never reaches the container — the API answers IAP_VERIFICATION_NOT_CONFIGURED and
  # nothing unlocks. Optional by design: a missing credential degrades to that error and a boot
  # warning from logIapReadiness, rather than failing the deploy.
  APPLE_IAP_ISSUER_ID: ${APPLE_IAP_ISSUER_ID:-}
  APPLE_IAP_KEY_ID: ${APPLE_IAP_KEY_ID:-}
  APPLE_IAP_PRIVATE_KEY: ${APPLE_IAP_PRIVATE_KEY:-}
  APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-com.walkchamp.app}
  # Default false: sandbox receipts mint real coins if accepted in production. App Review and
  # TestFlight buy in sandbox — set this true in the Coolify UI for the review window, then
  # turn it back off. See audit-2026-08-16.md F-02.
  APPLE_IAP_ALLOW_SANDBOX: ${APPLE_IAP_ALLOW_SANDBOX:-false}
  # Either the whole service-account JSON, or CLIENT_EMAIL + PRIVATE_KEY split out.
  GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}
  GOOGLE_PLAY_CLIENT_EMAIL: ${GOOGLE_PLAY_CLIENT_EMAIL:-}
  GOOGLE_PLAY_PRIVATE_KEY: ${GOOGLE_PLAY_PRIVATE_KEY:-}
  GOOGLE_PLAY_PACKAGE_NAME: ${GOOGLE_PLAY_PACKAGE_NAME:-com.walkchamp.app}
  # Default false: same free-coin risk as the Apple flag. Set true in the Coolify UI only while
  # Play internal-testing / license-tester purchases need to work, then turn it back off.
  GOOGLE_PLAY_ALLOW_TEST_PURCHASES: ${GOOGLE_PLAY_ALLOW_TEST_PURCHASES:-false}
  # ENABLE_DEV_IAP_PURCHASES is deliberately NOT forwarded. This stack runs NODE_ENV=production,
  # where platform:"dev" is refused with 403 DEV_PURCHASES_DISABLED — any authenticated client
  # could otherwise grant itself Mic Pass with a fabricated dev_ token. Unlocking that on a real
  # QA deployment means adding the key here on purpose, not flipping a variable in the UI.
  # Rolling-24h cap on referral bonus awards per referrer (audit F-07 anti-farming guard).
  REFERRAL_BONUS_MAX_PER_REFERRER_PER_DAY: ${REFERRAL_BONUS_MAX_PER_REFERRER_PER_DAY:-5}
  # Shared token authenticating the Google Play RTDN Pub/Sub push (audit 2026-08-17 M1). Set the
  # push subscription URL to .../api/webhooks/google/rtdn?token=<this>. Empty = RTDN rejected.
  GOOGLE_RTDN_VERIFICATION_TOKEN: ${GOOGLE_RTDN_VERIFICATION_TOKEN:-}
  # Hybrid step reconciliation (audit 2026-08-17 F-12). Both default ON: a funded race must
  # reconcile health-verified steps before payout — config.ts refuses to boot a production
  # cash deployment with the reconciliation pass off, and races.ts forces strict for any
  # entryAmountCents > 0 regardless of the policy flag.
  ENABLE_HYBRID_RECONCILIATION: ${ENABLE_HYBRID_RECONCILIATION:-true}
  HYBRID_REQUIRE_VERIFICATION_FOR_PAYOUT: ${HYBRID_REQUIRE_VERIFICATION_FOR_PAYOUT:-true}
  # Client-provided Health Connect / HealthKit source labels are not payout attestation. Keep
  # funded Unlimited days held until an authenticated ops verifier supplies the authoritative total.
  UNLIMITED_VERIFICATION_MODE: ${UNLIMITED_VERIFICATION_MODE:-manual}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
  ADMIN_SERVICE_KEY: ${ADMIN_SERVICE_KEY:?ADMIN_SERVICE_KEY is required}
  ADMIN_USER_IDS: ${ADMIN_USER_IDS:?ADMIN_USER_IDS is required}
  ALLOW_TEST_ROUTES: "false"
  ALLOW_DEMO_SEEDS: "false"
  MOCK_PROVIDERS_ENABLED: "false"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Bound the Node heap so a spike can't push the host into OOM and get the durable
    # redis-queue / redis-live containers (payment + live-race state) killed instead.
    mem_limit: ${API_CONTAINER_MEMORY:-1024m}
    expose:
      - "8080"
    depends_on:
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      # Soft dependency: the app lazy-connects to redis-live only when the canary flag is on, so
      # a redis-live problem must not block the whole fleet's startup (feature is OFF by default).
      redis-live:
        condition: service_started
    environment:
      <<: *app-env
      APP_PROCESS_ROLE: api
      RUN_BACKGROUND_JOBS: "false"
    # Applies pending migrations, then execs the server. See deploy/coolify/api-entrypoint.sh for
    # why migrations live here instead of in a Coolify deployment hook.
    command: ["/usr/local/bin/api-entrypoint"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Generous enough that a slow migration doesn't start burning healthcheck retries before
      # the server has had a chance to bind.
      start_period: 120s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: ${WORKER_CONTAINER_MEMORY:-1024m}
    depends_on:
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      # Soft dependency: the app lazy-connects to redis-live only when the canary flag is on, so
      # a redis-live problem must not block the whole fleet's startup (feature is OFF by default).
      redis-live:
        condition: service_started
      # api runs the migrations, so the worker must not start draining queues against a schema
      # that hasn't been brought forward yet.
      api:
        condition: service_healthy
    environment:
      <<: *app-env
      APP_PROCESS_ROLE: worker
      RUN_BACKGROUND_JOBS: "true"
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
      WORKER_HEARTBEAT_INTERVAL_SECONDS: "30"
      WORKER_HEALTHCHECK_MAX_AGE_SECONDS: "90"
    command: ["/usr/local/bin/worker-entrypoint"]
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/worker-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis-cache:
    image: redis:7.2-alpine
    restart: unless-stopped
    mem_limit: ${REDIS_CACHE_CONTAINER_MEMORY:-384m}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_CACHE_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - ${REDIS_CACHE_MAXMEMORY_POLICY:-allkeys-lfu}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis-queue:
    image: redis:7.2-alpine
    restart: unless-stopped
    mem_limit: ${REDIS_QUEUE_CONTAINER_MEMORY:-768m}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "900"
      - "1"
      - --save
      - "300"
      - "10"
      - --save
      - "60"
      - "10000"
      - --maxmemory
      - ${REDIS_QUEUE_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Dedicated instance for live race state (ZSET leaderboards + participant hashes). Kept
  # separate from redis-cache (allkeys-lfu would evict race keys) and redis-queue (a race
  # memory spike must not starve BullMQ payment/recovery jobs). Durable: AOF everysec.
  redis-live:
    image: redis:7.2-alpine
    restart: unless-stopped
    mem_limit: ${REDIS_LIVE_CONTAINER_MEMORY:-512m}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    # AOF everysec only (no RDB save points). AOF already bounds loss to ~1s; skipping RDB
    # avoids fork/COW memory spikes on this tight-headroom instance under write load.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
      - --maxmemory
      - ${REDIS_LIVE_MAXMEMORY:-384mb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-live-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  redis-queue-data:
  redis-live-data:
